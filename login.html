{% extends "base.html" %}
{% block title %}Log in · SecureGate{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="symbol">🔐</div>
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Log in to your account</h1>
  <p class="muted">Enter your details to open your secure dashboard.</p>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
